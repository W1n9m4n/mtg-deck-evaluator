<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Deck Evaluator</title>

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --bar: #2563eb;
      --good: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --bar: #60a5fa;
      --good: #4ade80;
      --warn: #facc15;
      --danger: #f87171;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    textarea {
      width: 100%;
      min-height: 320px;
      box-sizing: border-box;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--text);
      color: var(--bg);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .secondary {
      background: var(--card);
      color: var(--text);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .big {
      font-size: 24px;
      font-weight: bold;
      word-break: break-word;
    }

    .small {
      font-size: 13px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 72px 1fr 40px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 13px;
    }

    .bar-bg {
      height: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--bar);
    }

    .curve {
      display: flex;
      height: 150px;
      gap: 6px;
      align-items: end;
    }

    .curve-col {
      flex: 1;
      text-align: center;
      font-size: 12px;
    }

    .curve-bar {
      background: var(--bar);
      border-radius: 6px 6px 0 0;
      min-height: 2px;
    }

    .score-row {
      border-top: 1px solid var(--border);
      padding: 10px 0;
    }

    .score-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      margin: 2px;
    }

    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .danger { color: var(--danger); }

    ul {
      margin-top: 6px;
      padding-left: 20px;
    }

    @media (max-width: 820px) {
      .grid2,
      .grid3,
      .grid4 {
        grid-template-columns: 1fr;
      }

      .wrap {
        padding: 10px;
      }
    }
  </style>
</head>

<body class="dark">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>MTG Deck Evaluator</h1>
        <p class="muted">
          Standard / Legacy legality, structural score, meta benchmark, mana curve and deck composition.
        </p>
      </div>
      <button class="secondary" onclick="toggleDark()">Toggle Light / Dark</button>
    </div>

    <div class="grid grid2">
      <div class="card">
        <h2>Decklist</h2>
        <textarea id="deck" placeholder="Deck
4 Monastery Swiftspear
4 Lightning Strike
4 Monstrous Rage
20 Mountain

Sideboard
3 Torch the Tower"></textarea>
        <br><br>
        <button onclick="evaluateDeck()">Evaluate</button>
        <p id="status" class="muted"></p>
      </div>

      <div>
        <div class="grid grid4" id="kpis"></div>
        <div id="warnings"></div>
      </div>
    </div>

    <div class="grid grid2">
      <div class="card">
        <h2>Mana Curve</h2>
        <div id="curve"></div>
      </div>

      <div class="card">
        <h2>Mana Color Demand</h2>
        <div id="colors"></div>
      </div>

      <div class="card">
        <h2>Card Types</h2>
        <div id="types"></div>
      </div>

      <div class="card">
        <h2>Deck Composition</h2>
        <div id="composition"></div>
      </div>
    </div>

    <div class="grid grid2">
      <div class="card">
        <h2>Standard Report</h2>
        <div id="standard"></div>
      </div>

      <div class="card">
        <h2>Legacy Report</h2>
        <div id="legacy"></div>
      </div>
    </div>
  </div>

  <script>
    const BASICS = new Set(["plains", "island", "swamp", "mountain", "forest", "wastes"]);
    const COLORS = ["W", "U", "B", "R", "G"];

    function toggleDark() {
      document.body.classList.toggle("dark");
    }

    function cleanName(name) {
      return name
        .replace(/\s+\*F\*\s*$/i, "")
        .replace(/\s*\([A-Z0-9]{2,5}\)\s*\d+[a-z]?\s*$/i, "")
        .replace(/\s*\[[^\]]+\]\s*$/i, "")
        .trim();
    }

    function parseDeck(text) {
      let section = "main";
      const entries = [];

      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith("//") || line.startsWith("#")) continue;

        const lower = line.toLowerCase();

        if (["deck", "main", "mainboard", "deck:", "main:"].includes(lower)) {
          section = "main";
          continue;
        }

        if (["sideboard", "sideboard:", "sb", "sb:"].includes(lower)) {
          section = "sideboard";
          continue;
        }

        const match = line.match(/^(\d+)\s+(.+)$/);
        if (match) {
          entries.push({
            qty: Number(match[1]),
            name: cleanName(match[2]),
            section
          });
        }
      }

      return entries;
    }

    async function fetchCards(entries) {
      const names = [...new Set(entries.map(e => e.name.toLowerCase()))];
      const map = new Map();

      for (let i = 0; i < names.length; i += 75) {
        const chunk = names.slice(i, i + 75);

        const response = await fetch("https://api.scryfall.com/cards/collection", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identifiers: chunk.map(name => ({ name }))
          })
        });

        if (!response.ok) throw new Error("Scryfall lookup failed.");

        const json = await response.json();

        for (const card of json.data || []) {
          const full = String(card.name).toLowerCase();
          map.set(full, card);

          for (const face of card.card_faces || []) {
            if (face.name) map.set(String(face.name).toLowerCase(), card);
          }

          for (const requested of chunk) {
            if (full === requested || full.startsWith(requested + " //")) {
              map.set(requested, card);
            }
          }
        }

        for (const missing of json.not_found || []) {
          const original = String(missing.name || "").toLowerCase();

          try {
            const fuzzy = await fetch(
              "https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(original)
            );

            if (fuzzy.ok) {
              const card = await fuzzy.json();

              map.set(original, card);
              map.set(String(card.name).toLowerCase(), card);

              for (const face of card.card_faces || []) {
                if (face.name) map.set(String(face.name).toLowerCase(), card);
              }
            }
          } catch {}
        }
      }

      return map;
    }

    function isBasicName(name) {
      return BASICS.has(String(name).toLowerCase());
    }

    function fullText(entry) {
      const c = entry.card || {};
      const faces = (c.card_faces || [])
        .map(f => (f.type_line || "") + " " + (f.oracle_text || ""))
        .join(" ");

      return ((c.type_line || "") + " " + (c.oracle_text || "") + " " + faces).toLowerCase();
    }

    function manaCost(entry) {
      const c = entry.card || {};
      return (c.mana_cost || "") + (c.card_faces || []).map(f => f.mana_cost || "").join("");
    }

    function isLand(entry) {
      return /\bLand\b/i.test(entry.card?.type_line || "") || isBasicName(entry.name);
    }

    function isBasic(entry) {
      return isBasicName(entry.card?.name || entry.name) || /Basic Land/i.test(entry.card?.type_line || "");
    }

    function roles(entry) {
      const t = fullText(entry);

      return {
        creature: /creature/.test(t),
        interaction: /destroy|exile target|counter target|deals? \d+ damage|discard|sacrifice|damage to any target/.test(t),
        draw: /draw|scry|surveil|look at the top|explore/.test(t),
        ramp: /add .* mana|treasure|search your library.*land/.test(t)
      };
    }

    function qty(entries) {
      return entries.reduce((sum, entry) => sum + entry.qty, 0);
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function stats(entries) {
      const main = entries.filter(e => e.section === "main");
      const side = entries.filter(e => e.section === "sideboard");
      const nonlands = main.filter(e => !isLand(e));
      const nonlandQty = qty(nonlands) || 1;

      return {
        main,
        side,
        mainQty: qty(main),
        sideQty: qty(side),
        landQty: qty(main.filter(isLand)),
        creatureQty: qty(main.filter(e => roles(e).creature)),
        interactionQty: qty(main.filter(e => roles(e).interaction)),
        drawQty: qty(main.filter(e => roles(e).draw)),
        rampQty: qty(main.filter(e => roles(e).ramp)),
        avgMv: nonlands.reduce((sum, e) => sum + (e.card?.cmc || 0) * e.qty, 0) / nonlandQty,
        lowQty: qty(nonlands.filter(e => (e.card?.cmc ?? 99) <= 2)),
        highQty: qty(nonlands.filter(e => (e.card?.cmc ?? 0) >= 5)),
        unresolved: entries.filter(e => e.unresolved).map(e => e.name)
      };
    }

    function archetype(entries) {
      const s = stats(entries);
      const nonland = Math.max(1, s.mainQty - s.landQty);

      const creatureRate = s.creatureQty / nonland;
      const lowRate = s.lowQty / nonland;
      const interactionRate = s.interactionQty / nonland;

      if (creatureRate > 0.55 && lowRate > 0.5) return "Aggro";
      if (interactionRate > 0.38 && s.drawQty >= 6 && s.creatureQty <= 10) return "Control";
      if (lowRate > 0.4 && interactionRate > 0.22) return "Tempo";
      if (s.highQty >= 8 && s.landQty >= 25) return "Ramp";
      if (creatureRate > 0.35 && interactionRate > 0.18) return "Midrange";

      return "Rogue / Synergy";
    }

    function legality(entries, format) {
      const s = stats(entries);
      const problems = [];
      const copies = new Map();

      if (s.mainQty < 60) problems.push("Main deck has " + s.mainQty + " cards; minimum is 60.");
      if (s.sideQty > 15) problems.push("Sideboard has " + s.sideQty + " cards; maximum is 15.");
      if (s.unresolved.length) problems.push(s.unresolved.length + " card(s) could not be resolved.");

      for (const e of entries) {
        const key = (e.card?.name || e.name).toLowerCase();
        const prev = copies.get(key) || { qty: 0, entry: e };
        copies.set(key, { qty: prev.qty + e.qty, entry: e });

        const legal = e.card?.legalities?.[format];

        if (legal && legal !== "legal") {
          problems.push((e.card?.name || e.name) + " is " + legal + " in " + format + ".");
        }
      }

      for (const [name, value] of copies) {
        if (!isBasic(value.entry) && value.qty > 4) {
          problems.push((value.entry.card?.name || name) + ": " + value.qty + " copies; max is 4.");
        }
      }

      return problems;
    }

    function structureScore(entries, format) {
      const s = stats(entries);
      const type = archetype(entries);

      const singletons = s.main.filter(e => !isBasic(e) && e.qty === 1).length;
      const core = s.main
        .filter(e => !isBasic(e) && e.qty >= 3)
        .reduce((sum, e) => sum + e.qty, 0);

      const tapped = s.main
        .filter(e => isLand(e) && /enters (the battlefield )?tapped/i.test(e.card?.oracle_text || ""))
        .reduce((sum, e) => sum + e.qty, 0);

      const ideal = type === "Aggro" ? [20, 24] : type === "Control" ? [25, 28] : [23, 26];
      const idealMid = (ideal[0] + ideal[1]) / 2;

      const deckPlan =
        type === "Rogue / Synergy" ? 8 :
        format === "legacy" ? 11 :
        13;

      const landScore =
        s.landQty >= ideal[0] && s.landQty <= ideal[1]
          ? 8
          : clamp(8 - Math.abs(s.landQty - idealMid), 0, 8);

      const manaBase = clamp(
        landScore + 9 - tapped * (format === "legacy" ? 1.5 : 0.6),
        0,
        20
      );

      const curve = clamp(
        15
        - Math.max(0, s.avgMv - (type === "Aggro" ? 2.2 : 3.1)) * 6
        + (s.lowQty >= 10 ? 2 : -2)
        - (format === "legacy" ? 2 : 0),
        0,
        15
      );

      const density = clamp(
        6
        + Math.min(5, s.interactionQty / 2)
        + Math.min(3, s.drawQty / 2)
        + (s.creatureQty >= 14 || type === "Control" ? 3 : 0),
        0,
        15
      );

      const consistency = clamp(
        10
        + Math.min(5, core / 8)
        - Math.max(0, singletons - 4),
        0,
        15
      );

      const cardQuality = clamp(
        7
        + (s.avgMv <= 3 ? 2 : 0)
        + (format === "legacy" ? -4 : 0),
        0,
        10
      );

      const sideboard =
        s.sideQty === 15 ? 7 :
        s.sideQty > 0 ? 3 :
        0;

      return [
        {
          label: "Deckplan / Archetype",
          max: 15,
          value: Math.round(deckPlan),
          note: type
        },
        {
          label: "Mana Base",
          max: 20,
          value: Math.round(manaBase),
          note: s.landQty + " lands, " + tapped + " tapped lands"
        },
        {
          label: "Curve / Tempo",
          max: 15,
          value: Math.round(curve),
          note: "Average MV " + s.avgMv.toFixed(2)
        },
        {
          label: "Functional Density",
          max: 15,
          value: Math.round(density),
          note: s.creatureQty + " threats, " + s.interactionQty + " interaction, " + s.drawQty + " draw"
        },
        {
          label: "Consistency",
          max: 15,
          value: Math.round(consistency),
          note: core + " cards in 3–4x core, " + singletons + " singletons"
        },
        {
          label: "Card Quality",
          max: 10,
          value: Math.round(cardQuality),
          note: format === "legacy" ? "Legacy efficiency penalty applied" : "Standard efficiency heuristic"
        },
        {
          label: "Sideboard",
          max: 10,
          value: sideboard,
          note: s.sideQty + "/15 cards"
        }
      ];
    }

    function metaBenchmark(entries, format) {
      const s = stats(entries);
      const type = archetype(entries);
      const nonland = Math.max(1, s.mainQty - s.landQty);
      const lowRate = s.lowQty / nonland;

      if (format === "standard") {
        return [
          {
            label: "Archetype Fit",
            max: 5,
            value: type === "Rogue / Synergy" ? 2 : 4,
            note: type
          },
          {
            label: "Core Structure",
            max: 5,
            value: s.main.filter(e => e.qty >= 3 && !isBasic(e)).length >= 6 ? 4 : 2,
            note: "Repeated core cards"
          },
          {
            label: "Curve Match",
            max: 3,
            value: lowRate >= 0.35 ? 3 : 1,
            note: Math.round(lowRate * 100) + "% low curve"
          },
          {
            label: "Mana Match",
            max: 3,
            value: s.landQty >= 22 && s.landQty <= 27 ? 3 : 1,
            note: s.landQty + " lands"
          },
          {
            label: "Sideboard",
            max: 4,
            value: s.sideQty === 15 ? 3 : s.sideQty > 0 ? 1 : 0,
            note: s.sideQty + "/15"
          }
        ];
      }

      return [
        {
          label: "Archetype Fit",
          max: 4,
          value: type === "Rogue / Synergy" ? 1 : 2,
          note: type
        },
        {
          label: "Legacy Efficiency",
          max: 4,
          value: 1,
          note: "No live staple database connected"
        },
        {
          label: "Mana Quality",
          max: 3,
          value: s.landQty >= 18 && s.landQty <= 24 ? 2 : 1,
          note: s.landQty + " lands"
        },
        {
          label: "Interaction",
          max: 4,
          value: s.interactionQty >= 8 ? 2 : 1,
          note: s.interactionQty + " interaction"
        },
        {
          label: "Sideboard Hate",
          max: 3,
          value: s.sideQty === 15 ? 1 : 0,
          note: "Heuristic only"
        },
        {
          label: "Speed",
          max: 2,
          value: s.avgMv <= 2.2 ? 1 : 0,
          note: "Average MV " + s.avgMv.toFixed(2)
        }
      ];
    }

    function sumScore(lines) {
      return lines.reduce((sum, line) => sum + line.value, 0);
    }

    function ratingLabel(score, format) {
      if (format === "standard") {
        if (score >= 83) return "Meta-near";
        if (score >= 71) return "Competitive";
        if (score >= 56) return "FNM-ready";
        if (score >= 41) return "Playable";
        return "Casual";
      }

      if (score >= 85) return "Legacy Competitive";
      if (score >= 70) return "Legacy Rogue";
      if (score >= 50) return "Legacy casual / low";
      return "Legacy weak";
    }

    function renderKpis(entries) {
      const s = stats(entries);

      const items = [
        ["Main", s.mainQty],
        ["Lands", s.landQty],
        ["Avg MV", s.avgMv.toFixed(2)],
        ["Archetype", archetype(entries)]
      ];

      document.getElementById("kpis").innerHTML = items.map(([label, value]) => `
        <div class="card">
          <div class="muted">${label}</div>
          <div class="big">${value}</div>
        </div>
      `).join("");
    }

    function renderBar(target, rows) {
      const max = Math.max(1, ...rows.map(r => r.value));

      document.getElementById(target).innerHTML = rows.length
        ? rows.map(r => `
          <div class="bar-row">
            <div>${r.label}</div>
            <div class="bar-bg">
              <div class="bar-fill" style="width:${(r.value / max) * 100}%"></div>
            </div>
            <div>${r.value}</div>
          </div>
        `).join("")
        : `<p class="muted">No data.</p>`;
    }

    function renderCurve(entries) {
      const buckets = new Map();

      for (const e of entries.filter(e => e.section === "main" && !isLand(e))) {
        const mv = Math.floor(e.card?.cmc ?? 0);
        const key = mv >= 7 ? "7+" : String(mv);
        buckets.set(key, (buckets.get(key) || 0) + e.qty);
      }

      const rows = ["0", "1", "2", "3", "4", "5", "6", "7+"].map(label => ({
        label,
        value: buckets.get(label) || 0
      }));

      const max = Math.max(1, ...rows.map(r => r.value));

      document.getElementById("curve").innerHTML = `
        <div class="curve">
          ${rows.map(r => `
            <div class="curve-col">
              <div>${r.value}</div>
              <div class="curve-bar" style="height:${(r.value / max) * 120}px"></div>
              <div>${r.label}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderCharts(entries) {
      const s = stats(entries);

      const colorDemand = {};
      for (const c of COLORS) colorDemand[c] = 0;

      for (const e of entries.filter(e => e.section === "main" && !isLand(e))) {
        for (const c of COLORS) {
          const matches = (manaCost(e).match(new RegExp("\\{" + c + "\\}", "g")) || []).length;
          colorDemand[c] += matches * e.qty;
        }
      }

      const typeRows = [
        ["Land", /\bLand\b/i],
        ["Creature", /Creature/i],
        ["Instant", /Instant/i],
        ["Sorcery", /Sorcery/i],
        ["Artifact", /Artifact/i],
        ["Enchant.", /Enchantment/i]
      ].map(([label, rx]) => ({
        label,
        value: qty(entries.filter(e => e.section === "main" && rx.test(e.card?.type_line || "")))
      })).filter(r => r.value > 0);

      renderCurve(entries);

      renderBar(
        "colors",
        Object.entries(colorDemand)
          .map(([label, value]) => ({ label, value }))
          .filter(r => r.value > 0)
      );

      renderBar("types", typeRows);

      renderBar(
        "composition",
        [
          { label: "Lands", value: s.landQty },
          { label: "Threats", value: s.creatureQty },
          { label: "Interact.", value: s.interactionQty },
          { label: "Draw", value: s.drawQty },
          { label: "Ramp", value: s.rampQty }
        ].filter(r => r.value > 0)
      );
    }

    function renderScoreLines(lines) {
      return lines.map(line => `
        <div class="score-row">
          <div class="score-head">
            <span>${line.label}</span>
            <span>${line.value} / ${line.max}</span>
          </div>
          <div class="muted">${line.note}</div>
        </div>
      `).join("");
    }

    function renderReport(entries, format, targetId) {
      const legalProblems = legality(entries, format);
      const structure = structureScore(entries, format);
      const meta = metaBenchmark(entries, format);

      const structureTotal = sumScore(structure);
      const metaTotal = sumScore(meta);

      const legalHtml = legalProblems.length
        ? `<p class="danger"><strong>Legality: Issues</strong></p><ul>${legalProblems.map(x => `<li>${x}</li>`).join("")}</ul>`
        : `<p class="good"><strong>Legality: Legal</strong></p>`;

      document.getElementById(targetId).innerHTML = `
        ${legalHtml}

        <div class="card">
          <div class="muted">Structural Score</div>
          <div class="big">${structureTotal} / 100</div>
          <div class="muted">${ratingLabel(structureTotal, format)}</div>
        </div>

        <div class="card">
          <div class="muted">Meta Benchmark</div>
          <div class="big">${metaTotal} / 20</div>
          <div class="muted">Heuristic comparison, not live tournament data.</div>
        </div>

        <h3>Structural Evaluation</h3>
        ${renderScoreLines(structure)}

        <h3>Meta Benchmark</h3>
        ${renderScoreLines(meta)}
      `;
    }

    async function evaluateDeck() {
      const raw = document.getElementById("deck").value;
      const parsed = parseDeck(raw);

      if (!parsed.length) {
        document.getElementById("status").textContent = "No valid deck entries found.";
        return;
      }

      document.getElementById("status").textContent = "Loading card data from Scryfall...";

      try {
        const cards = await fetchCards(parsed);

        const entries = parsed.map(e => ({
          ...e,
          card: cards.get(e.name.toLowerCase()),
          unresolved: !cards.has(e.name.toLowerCase())
        }));

        const s = stats(entries);

        document.getElementById("status").textContent =
          "Evaluated. Main: " + s.mainQty + ", Sideboard: " + s.sideQty + ".";

        if (s.unresolved.length) {
          document.getElementById("warnings").innerHTML = `
            <div class="card">
              <h3>Unresolved cards</h3>
              <ul>${s.unresolved.map(x => `<li>${x}</li>`).join("")}</ul>
            </div>
          `;
        } else {
          document.getElementById("warnings").innerHTML = "";
        }

        renderKpis(entries);
        renderCharts(entries);
        renderReport(entries, "standard", "standard");
        renderReport(entries, "legacy", "legacy");
      } catch (error) {
        document.getElementById("status").textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
